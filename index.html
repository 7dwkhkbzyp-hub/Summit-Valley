<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Summit Valley 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fc7df;font-family:system-ui,-apple-system,sans-serif}#game{position:fixed;inset:0}#hud{position:fixed;top:12px;left:12px;z-index:5;color:#fff;background:rgba(11,20,27,.82);backdrop-filter:blur(8px);border:1px solid #ffffff25;border-radius:14px;padding:12px 15px;min-width:245px;line-height:1.5;box-shadow:0 8px 30px #0005}#title{font-size:18px;font-weight:900;letter-spacing:.12em}#toast{position:fixed;z-index:6;top:15px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:22px;background:#10212ddd;color:#fff;font-weight:700;pointer-events:none}#tools{position:fixed;z-index:5;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:96%}button{border:1px solid #ffffff22;background:#10212eee;color:#fff;border-radius:12px;padding:12px 14px;font-weight:800;box-shadow:0 5px 18px #0004}button.active{background:#fff;color:#14232c}#hint{position:fixed;right:12px;top:12px;z-index:5;background:#ffffffdc;color:#20313a;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.4}#cross{position:fixed;left:50%;top:50%;z-index:4;width:12px;height:12px;transform:translate(-50%,-50%);border:1px solid #fff8;border-radius:50%;pointer-events:none}@media(max-width:600px){#hud{min-width:190px;padding:9px 11px;font-size:12px}#title{font-size:15px}#hint{top:105px;right:8px}button{padding:11px 10px;font-size:11px}}
</style></head><body><div id="game"></div><div id="cross"></div><div id="hud"></div><div id="toast">SUMMIT VALLEY — 3D RESORT</div><div id="hint">Drag to orbit • Pinch to zoom<br>Build on the mountain</div>
<div id="tools"><button data-mode="view" class="active">EXPLORE</button><button data-mode="build">LODGE $25K</button><button data-mode="lift">CHAIRLIFT $45K</button><button data-mode="piste">PISTE</button><button id="upgrade">UPGRADE $30K</button><button id="pause">PAUSE</button><button id="save">SAVE</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js/+esm';

const root=document.getElementById('game'), scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc8df);scene.fog=new THREE.Fog(0xb9d5e3,150,420);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,700);camera.position.set(92,92,126);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,28,0);controls.enableDamping=true;controls.dampingFactor=.07;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=48;controls.maxDistance=270;

scene.add(new THREE.HemisphereLight(0xeaf6ff,0x55706d,2.4));const sun=new THREE.DirectionalLight(0xfff4dd,3.1);sun.position.set(-90,180,90);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-170;sun.shadow.camera.right=170;sun.shadow.camera.top=170;sun.shadow.camera.bottom=-170;scene.add(sun);

const world=new THREE.Group();scene.add(world);const terrainSize=240, seg=80;
function height(x,z){let h=7+46*Math.exp(-((x+35)**2+(z-15)**2)/7500)+31*Math.exp(-((x-58)**2+(z+18)**2)/4700)+24*Math.exp(-((x+75)**2+(z+35)**2)/5000);h+=7*Math.sin(x*.055)*Math.cos(z*.047)+4*Math.sin((x+z)*.12);if(z>55)h-=Math.max(0,z-55)*.22;return Math.max(2,h)}
const geo=new THREE.PlaneGeometry(terrainSize,terrainSize,seg,seg);geo.rotateX(-Math.PI/2);const pos=geo.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,height(x,z))}geo.computeVertexNormals();
const mat=new THREE.MeshStandardMaterial({color:0xe9f2f4,roughness:.96,metalness:0});const mountain=new THREE.Mesh(geo,mat);mountain.receiveShadow=true;world.add(mountain);

function matC(c,rough=.8){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}
const rockMat=matC(0x7d8790),darkRock=matC(0x56616a),trunk=matC(0x65462f),pine=matC(0x1d4b3a),pine2=matC(0x28624a),wood=matC(0x70472e),roof=matC(0x34383a),glass= new THREE.MeshStandardMaterial({color:0x83b9d0,roughness:.18,metalness:.25});
function tree(x,z,s=1){const y=height(x,z);const g=new THREE.Group();g.position.set(x,y,z);const t=new THREE.Mesh(new THREE.CylinderGeometry(.35*s,.55*s,3*s,7),trunk);t.position.y=1.5*s;t.castShadow=true;g.add(t);for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((3.2-i*.45)*s,5.5*s,8),i%2?pine:pine2);c.position.y=(4+i*2.2)*s;c.castShadow=true;g.add(c)}world.add(g)}
for(let i=0;i<145;i++){let x=(Math.random()-.5)*205,z=(Math.random()-.5)*190;if(Math.abs(x)<30&&z>-70&&z<70)continue;if(height(x,z)<12)continue;tree(x,z,.65+Math.random()*.7)}

function rock(x,z,s=1){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(2.5*s,.4),rockMat);m.position.set(x,height(x,z)+1.3*s,z);m.scale.y=.7;m.rotation.set(Math.random(),Math.random(),Math.random());m.castShadow=true;world.add(m)}
for(let i=0;i<32;i++)rock((Math.random()-.5)*190,(Math.random()-.5)*170,.6+Math.random()*1.8);

function cabin(x,z,scale=1,label='LODGE'){const g=new THREE.Group();g.position.set(x,height(x,z)+.1,z);g.scale.setScalar(scale);const base=new THREE.Mesh(new THREE.BoxGeometry(12,6,9),wood);base.position.y=3;base.castShadow=true;g.add(base);const r=new THREE.Mesh(new THREE.ConeGeometry(8,5,4,1),roof);r.rotation.y=Math.PI/4;r.scale.z=.8;r.position.y=8; r.castShadow=true;g.add(r);for(const xx of [-3.2,3.2]){const w=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.8,.18),glass);w.position.set(xx,3.5,4.55);g.add(w)}const door=new THREE.Mesh(new THREE.BoxGeometry(1.6,3,.2),matC(0x39271f));door.position.set(0,1.7,4.6);g.add(door);world.add(g);return g}
cabin(-7,-63,1.45,'BASE');cabin(27,-42,1.05,'RESTAURANT');cabin(-36,-28,.85,'RENTAL');cabin(-18,-52,.75,'SCHOOL');cabin(52,-8,.8,'CHALET');

function pathPoints(type){if(type===0)return [[-12,5,-70],[-16,28,-35],[-10,42,0],[-5,55,32],[0,63,58]];if(type===1)return [[-50,18,-58],[-42,35,-28],[-28,48,2],[-18,59,35],[0,66,65]];if(type===2)return [[58,8,-12],[44,24,5],[29,39,28],[16,53,51],[0,64,72]];return [[78,7,18],[61,25,34],[43,42,48],[23,55,63],[0,65,78]]}
const pisteDefs=[['green',0,0x39b86a,9],['blue',1,0x3189e6,8],['red',2,0xd8444a,7],['black',3,0x30353b,6]];
const pisteCurves=[];
function piste(def){const [name,id,color,width]=def,pts=pathPoints(id).map(p=>new THREE.Vector3(p[0],height(p[0],p[2])+.65,p[2]));const curve=new THREE.CatmullRomCurve3(pts);pisteCurves.push(curve);const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,80,width*.42,8,false),matC(color,.72));tube.receiveShadow=true;world.add(tube);const side=new THREE.Mesh(new THREE.TubeGeometry(curve,80,width*.7,8,false),matC(0xf7fbfc,.95));side.scale.y=.12;side.position.y-=.35;world.add(side);for(let i=0;i<18;i++){const t=i/18,p=curve.getPointAt(t),pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,1.6,6),matC(0x4c565a));pole.position.copy(p);pole.position.y+=.8;world.add(pole)}}pisteDefs.forEach(piste);

function tower(x,z){const y=height(x,z);const g=new THREE.Group();g.position.set(x,y,z);for(const dx of [-1.8,1.8]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.16,.22,8,6),darkRock);leg.position.set(dx,4,0);leg.rotation.z=dx>0?.12:-.12;g.add(leg)}const cross=new THREE.Mesh(new THREE.BoxGeometry(5,.25,.35),darkRock);cross.position.y=8;g.add(cross);world.add(g)}
function lift(a,b,type='QUAD'){const va=new THREE.Vector3(...a),vb=new THREE.Vector3(...b);const dx=vb.x-va.x,dz=vb.z-va.z;const len=Math.hypot(dx,dz);const ang=Math.atan2(dz,dx);const g=new THREE.Group();const mid=g;const cable=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,len,8),matC(0x222a2e));cable.rotation.z=Math.PI/2;cable.rotation.y=0;cable.position.set((va.x+vb.x)/2,(height(va.x,va.z)+height(vb.x,vb.z))/2+10,(va.z+vb.z)/2);cable.rotation.y=ang;world.add(cable);for(let i=0;i<=8;i++){const t=i/8,x=va.x+dx*t,z=va.z+(vb.z-va.z)*t;tower(x,z)}const carriers=[];for(let i=0;i<(type==='GONDOLA'?10:15);i++){const q=i/(type==='GONDOLA'?10:15);const car=new THREE.Group();const cabinMesh=type==='GONDOLA'?new THREE.Mesh(new THREE.BoxGeometry(2.4,1.8,1.8),glass):new THREE.Mesh(new THREE.BoxGeometry(3.4,.22,1.1),matC(0xb63237));car.add(cabinMesh);const hanger=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,3,6),darkRock);hanger.position.y=-1.5;car.add(hanger);world.add(car);carriers.push({car,q})}return {a,b,carriers,phase:Math.random(),type}}
const lifts=[lift([-8,-66],[0,67],'QUAD'),lift([28,-42],[-2,68],'GONDOLA'),lift([55,-9],[5,68],'SIX')];

function skier(curve,i){const g=new THREE.Group();const suit=matC([0xd84242,0x2875c6,0xe5a329,0x7b55b6,0x1f9d72,0xe87532][i%6]);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.4,4,7),suit);body.position.y=1.35;body.scale.z=.7;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.48,10,8),matC(0xe2b08c));head.position.y=2.55;g.add(head);for(const sx of [-.65,.65]){const ski=new THREE.Mesh(new THREE.BoxGeometry(.12,.08,2.8),matC(0x22282c));ski.rotation.y=Math.PI/2;ski.position.set(sx*.55,.15,0);g.add(ski)}for(const sx of [-.9,.9]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,2.2,6),matC(0xe9edf0));pole.rotation.z=sx*.28;pole.position.set(sx*.65,.8,.15);g.add(pole)}world.add(g);return {g,curve,t:Math.random(),speed:.012+Math.random()*.018}}
const skiers=Array.from({length:90},(_,i)=>skier(pisteCurves[i%4],i));

let money=250000,rep=62,guests=90,cap=180,day=1,hour=9,paused=false,mode='view',toastT=0;
function hud(){document.getElementById('hud').innerHTML='<div id="title">SUMMIT VALLEY</div>$'+Math.round(money).toLocaleString()+' &nbsp; • &nbsp; Guests '+Math.round(guests)+'/'+cap+'<br>Reputation '+Math.round(rep)+' &nbsp; • &nbsp; Day '+day+' • '+Math.floor(hour)+':'+String(Math.floor((hour%1)*60)).padStart(2,'0')+'<br>❄️ Powder 1.8m &nbsp; • &nbsp; Pistes 4 &nbsp; • &nbsp; Lifts '+lifts.length+'<br><small>3D RESORT ENGINE • LIVE SIMULATION</small>'}
function say(t){document.getElementById('toast').textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>document.getElementById('toast').textContent='SUMMIT VALLEY — 3D RESORT',2800)}
function worldPoint(){const ray=new THREE.Raycaster(),m=new THREE.Vector2(0,0);ray.setFromCamera(m,camera);const hit=ray.intersectObject(mountain)[0];return hit?hit.point:null}
function addLodge(p){if(money<25000)return say('Not enough cash');money-=25000;cap+=20;cabin(p.x,p.z,1,'LODGE');say('Lodge constructed • +20 guest capacity')}
function addLift(p){if(money<45000)return say('Not enough cash');money-=45000;cap+=25;const end=[p.x+20,p.y,p.z+55];lifts.push(lift([p.x,p.y,p.z],end,'QUAD'));say('Chairlift opened • +25 capacity')}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(q=>q.classList.remove('active'));b.classList.add('active');say(mode==='build'?'Tap centre crosshair to place a lodge':mode==='lift'?'Tap centre crosshair to start a chairlift':'Explore the 3D mountain')});
renderer.domElement.addEventListener('pointerup',()=>{if(mode==='view')return;const p=worldPoint();if(!p)return;if(mode==='build')addLodge(p);if(mode==='lift')addLift(p);if(mode==='piste')say('Piste painting is next: the 3D terrain system is now established')});
document.getElementById('upgrade').onclick=()=>{if(money<30000)return say('Not enough cash');money-=30000;cap+=35;rep=Math.min(100,rep+4);say('Mountain infrastructure upgraded • +35 capacity')};
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'RESUME':'PAUSE'};
document.getElementById('save').onclick=()=>{try{localStorage.setItem('summit3d',JSON.stringify({money,rep,cap,day,hour}));say('Resort saved')}catch(e){say('Save unavailable')}};
try{const s=JSON.parse(localStorage.getItem('summit3d'));if(s){money=s.money??money;rep=s.rep??rep;cap=s.cap??cap;day=s.day??day;hour=s.hour??hour}}catch(e){}
let last=performance.now();
function animate(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){hour+=dt*.12;if(hour>=24){hour-=24;day++;}const target=Math.min(cap,70+rep*1.5);guests+=(target-guests)*dt*.12;money+=guests*.075*dt;for(const s of skiers){s.t=(s.t+s.speed*dt)%1;const p=s.curve.getPointAt(s.t),p2=s.curve.getPointAt(Math.min(1,s.t+.006));s.g.position.copy(p);s.g.position.y+=.35;const dx=p2.x-p.x,dz=p2.z-p.z;s.g.rotation.y=Math.atan2(dx,dz);s.g.rotation.z=Math.sin(s.t*25)*.08}for(const l of lifts){for(const q of l.carriers){const t=(q.q+now*.000025+l.phase)%1;const x=l.a[0]+(l.b[0]-l.a[0])*t,z=l.a[2]+(l.b[2]-l.a[2])*t,y=height(x,z)+10;q.car.position.set(x,y,z)}}}controls.update();hud();renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script></body></html>
