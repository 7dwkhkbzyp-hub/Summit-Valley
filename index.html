<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07121d"><link rel="manifest" href="manifest.json"><title>Summit Valley — Ski Resort Tycoon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc6ea;font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0}#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(7,18,29,.82);border:1px solid #ffffff25;border-radius:14px;backdrop-filter:blur(14px);box-shadow:0 8px 28px #0018}
#logo{position:absolute;top:12px;left:12px;padding:10px 14px;font-weight:950;letter-spacing:.15em;font-size:15px}#logo i{font-style:normal;color:#61d9ff}#logo small{display:block;font-size:8px;letter-spacing:.16em;color:#9eb2c2;margin-top:2px}
#stats{position:absolute;top:12px;right:12px;display:flex;gap:13px;padding:8px 12px}.stat{font-size:8px;color:#9fb4c5}.stat b{display:block;color:#fff;font-size:13px;margin-top:1px}
#help{position:absolute;left:12px;top:67px;width:270px;padding:10px;font-size:10px;line-height:1.45;color:#b9cad6}#help b{color:#fff}
#toolbar{position:absolute;bottom:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;padding:7px;pointer-events:auto}button{border:1px solid #ffffff18;background:#132a3d;color:#eef8ff;border-radius:10px;padding:9px 11px;font-weight:800;font-size:10px}button.active{background:#0789b9}button:active{transform:translateY(1px)}
#toast{position:absolute;top:82px;left:50%;transform:translateX(-50%);padding:9px 13px;opacity:0;transition:.2s;font-size:11px}
@media(max-width:700px){#help{display:none}.stat:nth-child(n+5){display:none}button{padding:10px 9px}}
</style></head><body><div id="game"></div><div id="ui">
<div id="logo" class="panel">SUMMIT <i>VALLEY</i><small>SKI RESORT TYCOON</small></div>
<div id="stats" class="panel"><div class="stat">SNOW<b id="snow">92 cm</b></div><div class="stat">GUESTS<b id="guests">60</b></div><div class="stat">PISTES<b id="pistes">5</b></div><div class="stat">LIFTS<b id="lifts">2</b></div><div class="stat">REPUTATION<b id="rep">72%</b></div><div class="stat">CASH<b id="cash">£24,800</b></div></div>
<div id="help" class="panel"><b>SUMMIT VALLEY</b><br>Build a proper alpine resort. Drag to orbit, pinch/scroll to zoom. Guests ski the pistes, queue for lifts, spend money and react to weather. Build pistes, chairlifts, gondolas and facilities.</div>
<div id="toast" class="panel"></div>
<div id="toolbar" class="panel">
<button data-mode="select" class="active">SELECT</button><button data-mode="piste">BUILD PISTE</button><button data-mode="chair">CHAIRLIFT</button><button data-mode="gondola">GONDOLA</button><button data-mode="carpet">CARPET</button><button id="groom">GROOM</button><button id="snowBtn">SNOW</button><button id="sunBtn">SUN</button><button id="pause">PAUSE</button><button id="speed">1×</button><button id="save">SAVE</button><button id="load">LOAD</button>
</div></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.180.0/build/three.module.js';

const root=document.querySelector('#game'), scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c8eb); scene.fog=new THREE.Fog(0x91c8eb,75,150);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,220);
camera.position.set(52,46,55);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xdff3ff,0x5c6d72,2.2));
const sun=new THREE.DirectionalLight(0xffffff,3.2);sun.position.set(-35,70,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const world=new THREE.Group();scene.add(world);

const state={snow:.32,heat:.08,cash:24800,reputation:72,paused:false,speed:1,mode:'select',liftType:'chair',points:[],pistes:[],lifts:[],guests:[]};
function height(x,z){const r=Math.hypot(x*.92,z);let y=1.5+27*Math.max(0,1-r/55);y+=7*Math.exp(-((x+15)**2+(z-5)**2)/330)+5*Math.exp(-((x-16)**2+(z+12)**2)/260)-5*Math.exp(-((x+22)**2+(z+17)**2)/250);y+=2*Math.sin(x*.18)*Math.cos(z*.16);return y}
function slope(x,z){const e=.35;return Math.atan(Math.hypot(height(x+e,z)-height(x-e,z),height(x,z+e)-height(x,z-e))/(2*e))}
function mat(c,rough=1){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}
const snowMat=mat(0xeaf4f8),rockMat=mat(0x59666b),pineMat=mat(0x1e4f3b),trunkMat=mat(0x65422a),darkMat=mat(0x18232a);

function mountain(){
 const N=90,size=112,geo=new THREE.BufferGeometry(),pos=[],norm=[];
 for(let z=0;z<N-1;z++)for(let x=0;x<N-1;x++){
  const P=[];for(const [ix,iz] of [[x,z],[x+1,z],[x,z+1],[x+1,z+1]]){const X=-size/2+ix*size/(N-1),Z=-size/2+iz*size/(N-1),Y=height(X,Z);P.push(new THREE.Vector3(X,Y,Z))}
  for(const tri of [[0,1,2],[1,3,2]]){const a=P[tri[0]],b=P[tri[1]],c=P[tri[2]],n=new THREE.Vector3().crossVectors(new THREE.Vector3().subVectors(b,a),new THREE.Vector3().subVectors(c,a)).normalize();for(const q of tri){const p=P[q];pos.push(p.x,p.y,p.z);norm.push(n.x,n.y,n.z)}}
 }
 geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('normal',new THREE.Float32BufferAttribute(norm,3));
 const m=new THREE.MeshStandardMaterial({vertexColors:false,roughness:.95});
 const colors=[];for(let i=0;i<pos.length;i+=3){const y=pos[i+1],x=pos[i],z=pos[i+2],sl=slope(x,z);let c;
  if(y>22||sl<.30)c=new THREE.Color(0xf2f7fa);else if(sl>.68)c=new THREE.Color(0x566064);else c=new THREE.Color(0x748085);
  colors.push(c.r,c.g,c.b)}geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));m.vertexColors=true;
 const mesh=new THREE.Mesh(geo,m);mesh.receiveShadow=true;world.add(mesh);
}mountain();

function cylinder(r1,r2,h,material,rad=8){return new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,rad),material)}
function cone(r,h,material,rad=8){return new THREE.Mesh(new THREE.ConeGeometry(r,h,rad),material)}
function skierMesh(board=false){
 const g=new THREE.Group(), suit=mat(board?0xe04d3f:0x2d6cdf), black=mat(0x111820), skin=mat(0xf1c7a5), helmet=mat(board?0xf0b52c:0x202b36);
 const body=cylinder(.20,.25,.62,suit,8);body.position.y=.85;body.rotation.z=.12;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),skin);head.position.set(0,1.28,0);g.add(head);
 const hel=new THREE.Mesh(new THREE.SphereGeometry(.20,10,6,0,Math.PI*2,0,Math.PI*.58),helmet);hel.position.set(0,1.33,0);g.add(hel);
 for(const s of [-1,1]){const leg=cylinder(.055,.065,.52,black,6);leg.position.set(s*.09,.42,0);leg.rotation.z=s*.06;g.add(leg);const ski=new THREE.Mesh(new THREE.BoxGeometry(.055,.035,.72),black);ski.position.set(s*.09,.12,.02);ski.rotation.y=board?0:Math.PI/2;g.add(ski)}
 if(board){const b=new THREE.Mesh(new THREE.BoxGeometry(.16,.04,.75),black);b.position.y=.13;g.add(b)}
 else for(const s of [-1,1]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.72,5),black);pole.position.set(s*.25,.48,.05);pole.rotation.z=s*.32;g.add(pole)}
 return g;
}
const skierProto=skierMesh(false), boardProto=skierMesh(true);

function tree(x,z,s=1){const g=new THREE.Group(),y=height(x,z),tr=cylinder(.13*s,.18*s,1.5*s,trunkMat,7);tr.position.y=.75*s;g.add(tr);
 for(let i=0;i<3;i++){const q=cone((1.0-i*.23)*s,1.55*s,pineMat,9);q.position.y=1.5*s+i*.85*s;g.add(q)}g.position.set(x,y,z);world.add(g)}
for(let i=0;i<95;i++){const a=i*2.399,x=((i*31.7)%100)-50,z=((i*47.3)%100)-50;if(Math.hypot(x,z)>10&&height(x,z)<23)tree(x,z,.65+(i%4)*.12)}

function chalet(x,z,scale=1,label='LODGE'){const g=new THREE.Group(),y=height(x,z);
 const base=new THREE.Mesh(new THREE.BoxGeometry(5*scale,2.5*scale,4*scale),mat(0xb87948));base.position.y=1.25*scale;g.add(base);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(3.8*scale,2.6*scale,4),mat(0x26333a));roof.rotation.y=Math.PI/4;roof.position.y=3.8*scale;g.add(roof);
 for(const s of [-1,1]){const win=new THREE.Mesh(new THREE.BoxGeometry(1*scale,.9*scale,.08),mat(0x8bd9ed));win.position.set(s*1.4*scale,1.45*scale,-2.03*scale);g.add(win)}
 const sign=new THREE.Mesh(new THREE.BoxGeometry(2*scale,.4*scale,.06),mat(0xe8c46a));sign.position.set(0,2.25*scale,-2.08*scale);g.add(sign);
 g.position.set(x,y,z);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});world.add(g);return g}
chalet(-3,29,1.15,'BASE'),chalet(10,27,.82,'CAFE'),chalet(22,17,.7,'HOTEL'),chalet(-19,18,.68,'LODGE');

function pisteMesh(points,color){
 const shape=new THREE.Shape(),w=.95;const left=[],right=[];
 points.forEach((p,i)=>{const a=points[Math.max(0,i-1)],b=points[Math.min(points.length-1,i+1)],dx=b.x-a.x,dz=b.z-a.z,l=Math.hypot(dx,dz)||1,nx=-dz/l,nz=dx/l;left.push(new THREE.Vector3(p.x+nx*w,height(p.x+nx*w,p.z+nz*w)+.22,p.z+nz*w));right.push(new THREE.Vector3(p.x-nx*w,height(p.x-nx*w,p.z-nz*w)+.22,p.z-nz*w))});
 const pos=[],norm=[];for(let i=0;i<points.length-1;i++){for(const q of [left[i],left[i+1],right[i],left[i+1],right[i+1],right[i]]){pos.push(q.x,q.y,q.z);norm.push(0,1,0)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('normal',new THREE.Float32BufferAttribute(norm,3));const m=new THREE.MeshStandardMaterial({color,roughness:.88});const mesh=new THREE.Mesh(geo,m);mesh.receiveShadow=true;world.add(mesh);return mesh}
function grade(points){let total=0;for(let i=1;i<points.length;i++)total+=slope(points[i].x,points[i].z);const a=total/(points.length-1);return a<.22?['green',0x35c76f]:a<.34?['blue',0x3686ef]:a<.49?['red',0xef4a4a]:['black',0x20242a]}
function addPiste(points){const [type,col]=grade(points);state.pistes.push({points,type,mesh:pisteMesh(points,col),condition:100});toast(type.toUpperCase()+' piste built')}
[[[-18,18],[-13,7],[-8,-10]],[[8,20],[5,8],[1,-14]],[[17,17],[13,5],[9,-16]],[[-3,26],[-2,10],[-4,-19]],[[22,5],[18,-6],[14,-23]]].forEach(a=>addPiste(a.map(([x,z])=>new THREE.Vector3(x,height(x,z)+.35,z))));

function cable(a,b){
 const pa=new THREE.Vector3(a.x,height(a.x,a.z)+6,a.z),pb=new THREE.Vector3(b.x,height(b.x,b.z)+6,b.z),curve=new THREE.LineCurve3(pa,pb),geo=new THREE.TubeGeometry(curve,24,.055,6,false),line=new THREE.Mesh(geo,darkMat);world.add(line)}
function lift(a,b,type){
 const g=new THREE.Group(),cost=type==='gondola'?8500:type==='chair'?3500:1800;
 for(let i=0;i<9;i++){const t=i/8,x=THREE.MathUtils.lerp(a.x,b.x,t),z=THREE.MathUtils.lerp(a.z,b.z,t),y=height(x,z),tower=cylinder(.16,.2,5,darkMat,8);tower.position.set(x,y+2.5,z);g.add(tower);const arm=new THREE.Mesh(new THREE.BoxGeometry(1.1,.14,.14),darkMat);arm.position.set(x,y+5,z);g.add(arm)}
 cable(a,b);const stationA=chalet(a.x,a.z,.55,'STATION'),stationB=chalet(b.x,b.z,.55,'STATION');
 for(let i=0;i<10;i++){const t=i/10,carrier=type==='gondola'?new THREE.Mesh(new THREE.BoxGeometry(.9,.55,.75),mat(0xe8edf0)):new THREE.Mesh(new THREE.BoxGeometry(.95,.12,.32),mat(0x202a31));carrier.userData.t=t;carrier.userData.type=type;carrier.position.set(THREE.MathUtils.lerp(a.x,b.x,t),height(THREE.MathUtils.lerp(a.x,b.x,t),THREE.MathUtils.lerp(a.z,b.z,t))+4.7,THREE.MathUtils.lerp(a.z,b.z,t));g.add(carrier)}
 g.userData={a,b,type,cost,phase:Math.random()*10};world.add(g);state.lifts.push(g);state.cash-=cost;ui();toast((type==='chair'?'Chairlift':type==='gondola'?'Gondola':'Magic carpet')+' built — £'+cost.toLocaleString())}
lift({x:-3,z:27},{x:-3,z:-20},'chair');lift({x:14,z:20},{x:14,z:-19},'gondola');

for(let i=0;i<65;i++){const q=(i%state.pistes.length),g=skierMesh(i%5===0);g.scale.setScalar(.58);g.userData={p:q,t:Math.random(),speed:.0018+Math.random()*.002};world.add(g);state.guests.push(g)}

function ui(){snow.textContent=Math.round(55+state.snow*125)+' cm';guests.textContent=state.guests.length;pistes.textContent=state.pistes.length;lifts.textContent=state.lifts.length;rep.textContent=Math.round(state.reputation)+'%';cash.textContent='£'+Math.round(state.cash).toLocaleString()}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.opacity=0,1500)}
function setMode(m){state.mode=m;state.points=[];document.querySelectorAll('#toolbar button[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));toast(m==='piste'?'Tap points down the mountain, then tap the final point again.':'Mode: '+m)}
document.querySelectorAll('#toolbar button[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY};if(state.mode==='piste'||state.mode==='chair'||state.mode==='gondola'||state.mode==='carpet'){const v=pick(e);if(!v)return;state.points.push(v);if(state.mode==='piste'&&state.points.length>=3&&e.detail>=2){addPiste(state.points);state.points=[]}else if(state.mode!=='piste'&&state.points.length===2){lift(state.points[0],state.points[1],state.mode);state.points=[]}}});
let drag=null;
renderer.domElement.addEventListener('pointermove',e=>{if(!drag||state.mode!=='select')return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),-dx*.006);const r=Math.hypot(camera.position.x,camera.position.z);camera.position.x=camera.position.x/r*77;camera.position.z=camera.position.z/r*77;camera.position.y=Math.max(25,Math.min(70,camera.position.y-dy*.08));camera.lookAt(0,10,0);drag={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',()=>drag=null);
function pick(e){const rect=renderer.domElement.getBoundingClientRect(),mouse=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-0);const p=new THREE.Vector3();ray.ray.intersectPlane(plane,p);return new THREE.Vector3(p.x,height(p.x,p.z)+.3,p.z)}
document.querySelector('#groom').onclick=()=>{state.pistes.forEach(p=>p.condition=100);state.cash-=450;toast('All pistes groomed');ui()};
document.querySelector('#snowBtn').onclick=()=>{state.snow=Math.min(1,state.snow+.25);state.heat=Math.max(0,state.heat-.1);toast('Heavy snowfall')};
document.querySelector('#sunBtn').onclick=()=>{state.heat=Math.min(1,state.heat+.25);state.snow=Math.max(0,state.snow-.08);toast('Sunny weather')};
document.querySelector('#pause').onclick=e=>{state.paused=!state.paused;e.currentTarget.textContent=state.paused?'PLAY':'PAUSE'};
document.querySelector('#speed').onclick=e=>{state.speed=state.speed===1?2:state.speed===2?4:1;e.currentTarget.textContent=state.speed+'×'};
document.querySelector('#save').onclick=()=>{localStorage.setItem('svSave',JSON.stringify({cash:state.cash,snow:state.snow,heat:state.heat,reputation:state.reputation}));toast('Resort saved')};
document.querySelector('#load').onclick=()=>{const x=JSON.parse(localStorage.getItem('svSave')||'null');if(!x)return toast('No save found');Object.assign(state,x);ui();toast('Resort loaded')};
let last=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/16.67);last=now;if(!state.paused){state.guests.forEach(g=>{const p=state.pistes[g.userData.p],idx=Math.min(p.points.length-2,Math.floor(g.userData.t*(p.points.length-1))),a=p.points[idx],b=p.points[idx+1],f=g.userData.t*(p.points.length-1)%1;const x=THREE.MathUtils.lerp(a.x,b.x,f),z=THREE.MathUtils.lerp(a.z,b.z,f);g.position.set(x,height(x,z)+.38,z);g.rotation.y=Math.atan2(b.x-a.x,b.z-a.z);g.userData.t+=g.userData.speed*state.speed*dt;if(g.userData.t>1){g.userData.t=0;g.userData.p=Math.floor(Math.random()*state.pistes.length);state.cash+=1.2}});state.lifts.forEach(l=>l.children.forEach((o,i)=>{if(o.userData&&o.userData.t!==undefined){o.userData.t=(o.userData.t+.0007*state.speed*dt)%1;const t=o.userData.t,x=THREE.MathUtils.lerp(l.userData.a.x,l.userData.b.x,t),z=THREE.MathUtils.lerp(l.userData.a.z,l.userData.b.z,t);o.position.set(x,height(x,z)+4.7,z)}}));state.cash+=.03*state.guests.length*state.speed*dt}ui();renderer.render(scene,camera)}
camera.lookAt(0,10,0);ui();requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
